<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Momo ♡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;600;700&display=swap">
<style>
:root{--sp:#FCE7F0;--bl:#FADCE8;--bp:#FF4F91;--pl:#30172E;--wh:#FFF9FC;--lv:#E6D9FF;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sp);color:var(--pl);font-family:Quicksand,system-ui,sans-serif}
body{background:radial-gradient(circle at 20% 10%,var(--lv) 0,transparent 45%),radial-gradient(circle at 85% 90%,var(--bl) 0,transparent 50%),linear-gradient(160deg,var(--wh),var(--sp))}
#stage{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;transition:opacity .5s;z-index:2}
.sc{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px));gap:14px;position:relative}
h1,h2{margin:0;font-weight:700;line-height:1.15}
h2{font-size:clamp(22px,6vw,32px)}
.script{font-family:'Great Vibes',cursive;color:var(--bp);font-weight:400;text-shadow:0 0 24px #ff4f9155}
.big{font-size:clamp(56px,20vw,120px);line-height:1}
p{margin:0;max-width:34ch;font-size:clamp(15px,4vw,18px);line-height:1.5}
.btn{font:inherit;font-weight:700;font-size:17px;color:#fff;border:0;border-radius:999px;padding:14px 30px;min-height:48px;background:linear-gradient(135deg,#ff7ab0,var(--bp));box-shadow:0 8px 26px #ff4f9166,0 0 0 4px #ff4f9122;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.56,.64,1),box-shadow .25s}

.p{position:absolute;font-style:normal;font-size:18px;will-change:transform}

.cd b{display:block;font-size:clamp(24px,8vw,38px);color:var(--bp);font-variant-numeric:tabular-nums}
.cd b.t{animation:tick .35s}@keyframes tick{from{transform:translateY(-8px);opacity:.3}}

.gb::after{content:"";position:absolute;left:50%;width:22px;margin-left:-11px;top:0;bottom:0;background:#fff9}

.lid::after{content:"";position:absolute;left:50%;width:22px;margin-left:-11px;top:0;bottom:0;background:#fff9}
.bow{position:absolute;left:50%;top:-6px;font-size:34px;transform:translateX(-50%);transition:all .8s}
.gift.open .lid{transform:translate(-30px,-60px) rotate(-60deg)}.gift.open .bow{transform:translate(40px,-70px) rotate(80deg) scale(.6);opacity:0}
.gift.open .gb{box-shadow:0 0 70px 20px #ffd6e9}

.tier i{position:absolute;width:8px;height:3px;border-radius:2px;transform:rotate(var(--r))}

.bg8{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px;width:100%;max-width:400px}
.b8{position:relative;border:0;background:none;padding:0;height:124px;cursor:pointer;transform-origin:50% 100%;animation:bob var(--d) ease-in-out infinite;animation-delay:var(--l)}

.b8.x{pointer-events:none}.b8.x span{animation:pp .32s forwards}.b8.x em,.b8.x::after{visibility:hidden}

.wc{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#30172e55;padding:20px}

.sw{position:relative;width:min(88vw,360px);aspect-ratio:1312/1199;border-radius:26px;overflow:hidden;box-shadow:0 0 0 4px #fff,0 0 36px #ff4f91aa}
.un{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(145deg,#fff,var(--bl));font-size:36px}
.un{padding:0}.un img{width:100%;height:100%;object-fit:cover;display:block}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
/* letter */
.env{font-size:96px;cursor:pointer;border:0;background:none;animation:fl 2.4s infinite}
.lt{max-width:420px;text-align:left;font-family:'Great Vibes',cursive;font-size:clamp(22px,6vw,27px);line-height:1.45;color:#4a2342}
.lt p{max-width:none;font:inherit;margin:0 0 14px;opacity:0;animation:in 1s forwards}
/* player */
#pl{position:fixed;z-index:70;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;background:#fffc;backdrop-filter:blur(8px);box-shadow:0 6px 20px #ff4f9144}
#pl button{width:38px;height:38px;border:0;border-radius:50%;background:var(--bp);color:#fff;font-size:16px;cursor:pointer}
#pl input{width:70px;accent-color:var(--bp)}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}.eq i{width:3px;background:var(--bp);height:4px;border-radius:2px}
.eq.on i{animation:eq .6s infinite alternate}.eq i:nth-child(2){animation-delay:.2s!important}.eq i:nth-child(3){animation-delay:.4s!important}@keyframes eq{to{height:16px}}
.hid{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}

<script>

const cv=document.createElement('canvas'),dpr=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight,R=(a,b)=>a+Math.random()*(b-a);

/* ===== music (original synthesized instrumental) ===== */

const cv=$('#cv',el),box=cv.parentElement,dpr=Math.min(devicePixelRatio||1,2),W=box.clientWidth,H=box.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d',{willReadFrequently:true});g.scale(dpr,dpr);
const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#ff9ec6');gr.addColorStop(.5,'#e3b8ff');gr.addColorStop(1,'#ff4f91');g.fillStyle=gr;g.fillRect(0,0,W,H);g.fillStyle='#fff8';for(let i=0;i<40;i++){g.font=(10+Math.random()*12)+'px serif';g.fillText(pick(['✦','♡','✧']),Math.random()*W,Math.random()*H)}

let down=false,lp=null,n=0,done=false;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
function check(){const d=g.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;for(let i=3;i<d.length;i+=64){t++;if(d[i]<20)c++}if(c/t>.4){done=true;cv.style.transition='opacity .9s';cv.style.opacity=0;cv.style.pointerEvents='none';const[x,y]=mid(box);burst(x,y,50);later(()=>burst(x,y,30,['✨','💖']),400);later(()=>$('#m',el).classList.add('on'),700)}}

function(){const P=["Happy Birthday, my dearest Momo! ❤️🎂","Today is your special day, and I just want you to know how incredibly precious you are to me. I hope this new chapter of your life brings you endless happiness, beautiful memories, success, and everything your heart wishes for. 💕","You deserve all the love, care, and happiness in the world. May your smile never fade, may your dreams always find their way to reality, and may life surprise you with the most beautiful things. 🦋","Thank you for being you. I hope this little surprise brings a smile to your face, because making you happy is one of the sweetest feelings ever. 🥰","Happy Birthday once again, my favorite person. Sending you all my love, today and always. 💖","Forever with love,<br>Hamza ♡ 💌"];
